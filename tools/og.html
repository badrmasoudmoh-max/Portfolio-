<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>OG card (dev tool)</title>
  <!-- Dev-only source for public/og-image.jpg (1200x630). Rendered with headless Chrome by tools/render-og.mjs. -->
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(60% 60% at 78% 45%, rgb(52 59 39 / 0.55), transparent 70%), var(--ink); }
    .copy { position: absolute; left: 64px; top: 70px; z-index: 3; }
    .copy .eyebrow { font-size: 18px; }
    .title { margin-top: 18px; font-family: var(--font-display); font-size: 104px; line-height: 0.92; text-transform: uppercase; }
    .title span { display: block; }
    .title .accent { color: var(--orange); transform: skewX(-8deg); transform-origin: left bottom; }
    .name { margin-top: 30px; font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .name b { color: var(--orange); font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: 0.02em; margin-right: 10px; }
    .slab { position: absolute; left: 700px; top: 80px; width: 360px; height: 430px; background: var(--olive) var(--grain); background-blend-mode: soft-light; transform: rotate(-6deg); }
    .circle { position: absolute; left: 800px; top: 40px; width: 300px; height: 300px; border-radius: 50%; background: var(--orange); }
    .char { position: absolute; left: 690px; bottom: -40px; height: 640px; z-index: 2; }
    .sticker-wrap { position: absolute; right: 36px; top: 70px; z-index: 4; }
    .sticker { font-size: 26px; transform: rotate(7deg); }
    .stamp { position: absolute; right: 50px; bottom: 40px; z-index: 4; font-family: var(--font-display); font-size: 40px; line-height: 0.95; color: var(--lime); text-align: center; text-transform: uppercase; transform: rotate(-8deg); }
  </style>
</head>
<body>
  <div class="card grain">
    <div class="copy">
      <p class="eyebrow">Independent graphic designer / Egypt</p>
      <h1 class="title"><span>I make</span><span class="accent">Visual noise.</span><span>That matters.</span></h1>
      <p class="name"><b>BADR*</b> Badr Masoud — Graphic &amp; Social Media Designer</p>
    </div>
    <div class="slab"></div>
    <div class="circle"></div>
    <img class="char" src="/src/assets/img/hero-sitting-1086.png" alt="">
    <div class="sticker-wrap"><span class="sticker">Ideas<br>design<br>impact</span></div>
    <p class="stamp">Controlled<br>chaos</p>
  </div>
</body>
</html>
